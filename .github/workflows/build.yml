name: Build Lawh

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  # Android package id. Choose it ONCE: it can never change after publishing on Google Play.
  APP_ORG: com.bazzo
  FLUTTER_VERSION: '3.27.4'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Build the complete Quran data (6,236 verses)
        run: python3 scripts/build_quran_data.py

      - name: Build Madinah Mushaf pages (604 pages)
        run: python3 scripts/build_mushaf_pages.py

      - name: Download Amiri Quran font
        run: python3 scripts/fetch_fonts.py

      - name: Generate Android project
        run: |
          rm -rf android
          flutter create . --platforms=android --org "$APP_ORG" --project-name lawh
          rm -f test/widget_test.dart

      - name: Prepare release signing (only if secrets are set)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=upload-keystore.jks"
            } > android/key.properties
            echo "Release signing enabled."
          else
            echo "::warning::No signing secrets found. The APK/AAB will be debug-signed: fine for testing, NOT accepted by Google Play."
          fi

      - name: Configure Android (label + signing)
        run: python3 scripts/configure_android.py

      - name: Get dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Unit tests (non-blocking)
        continue-on-error: true
        run: flutter test

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons --build-number=${{ github.run_number }}

      - name: Build App Bundle (Google Play)
        run: flutter build appbundle --release --no-tree-shake-icons --build-number=${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lawh-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Lawh-AAB
          path: build/app/outputs/bundle/release/app-release.aab

# Trigger an immediate build from the default branch.
