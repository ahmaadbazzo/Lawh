name: Generate upload keystore (run once)

# Creates a signing key for Google Play. Run it ONCE, download the artifact,
# keep the files somewhere safe, then add the 4 secrets described in README.md.
# IMPORTANT: use this only in a PRIVATE repository (artifacts of public repos are visible to others).

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Generate keystore
        run: |
          P=$(openssl rand -hex 16)
          keytool -genkeypair -keystore upload-keystore.jks -storetype PKCS12 \
            -keyalg RSA -keysize 2048 -validity 10000 -alias upload \
            -storepass "$P" -keypass "$P" -dname "CN=Lawh, O=Lawh, C=SY"
          {
            echo "KEYSTORE_PASSWORD=$P"
            echo "KEY_PASSWORD=$P"
            echo "KEY_ALIAS=upload"
            echo "KEYSTORE_BASE64=$(base64 -w0 upload-keystore.jks)"
          } > credentials.txt

      - name: Upload (kept for 1 day only)
        uses: actions/upload-artifact@v4
        with:
          name: upload-keystore
          path: |
            upload-keystore.jks
            credentials.txt
          retention-days: 1
